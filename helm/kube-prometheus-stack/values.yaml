global:
  rbac:
    create: true
  imageRegistry: ""
  imagePullSecrets: []

defaultRules:
  create: true
  rules:
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryWorkingSetBytes: true
  additionalRuleLabels: {}
  additionalRuleGroupLabels: {}

windowsMonitoring:
  enabled: false

kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    enabled: true
    kubelet: true
    cAdvisor: true
    probes: false
    resource: false
    interval: 30s
    cAdvisorInterval: 30s

kubernetesServiceMonitors:
  enabled: true

kubeScheduler:
  enabled: false
  serviceMonitor:
    resource:
      enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeDns:
  enabled: false
kubeApiServer:
  enabled: false
coreDns:
  enabled: false
thanosRuler:
  enabled: false
  extraSecret:
    data: {}

nodeExporter:
  enabled: true

alertmanager:
  enabled: true
  servicePerReplica:
    enabled: false
  serviceMonitor:
    selfMonitor: true
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  service:
    enabled: true
    port: 9093
    targetPort: http-web
    ipDualStack:
      enabled: false
  secret:
    annotations: {}
  ingress:
    enabled: false
    servicePort: 9093
  route:
    main:
      enabled: false
  podDisruptionBudget:
    enabled: false
  networkPolicy:
    enabled: false
  extraSecret:
    data: {}
  verticalPodAutoscaler:
    enabled: false
  alertmanagerSpec:
    routePrefix: /
    externalUrl: http://kube-prometheus-stack-alertmanager.monitoring.svc
    paused: false
    logFormat: logfmt
    logLevel: info
    retention: 120h
    portName: http-web
    hostNetwork: false
    automountServiceAccountToken: true
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

grafana:
  enabled: true
  operator:
    dashboardsConfigMapRefEnabled: false
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  persistence:
    enabled: true
    storageClassName: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus:
  enabled: true
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  servicePerReplica:
    enabled: false
  thanosService:
    enabled: false
  thanosServiceExternal:
    enabled: false
  thanosIngress:
    enabled: false
  ingress:
    enabled: false
    servicePort: 9090
  route:
    main:
      enabled: false
  podDisruptionBudget:
    enabled: false
  networkPolicy:
    enabled: false
  extraSecret:
    data: {}
  service:
    enabled: true
    port: 9090
    targetPort: http-web
    ipDualStack:
      enabled: false
  serviceMonitor:
    selfMonitor: true
  verticalPodAutoscaler:
    enabled: false
  prometheusSpec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
    routePrefix: /
    externalUrl: http://kube-prometheus-stack-prometheus.monitoring.svc
    paused: false
    logLevel: info
    logFormat: logfmt
    listenLocal: false
    enableOTLPReceiver: false
    enableAdminAPI: false
    portName: http-web
    hostNetwork: false
    additionalScrapeConfigsSecret:
      enabled: false
    replicas: 2
    retention: 10d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi

# Required by the chart templates; keep the operator enabled for the
# Prometheus and Alertmanager custom resources below.
prometheusOperator:
  enabled: true
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  tls:
    enabled: true
    tlsMinVersion: VersionTLS13
    internalPort: 10250
  admissionWebhooks:
    enabled: true
    failurePolicy: ""
    timeoutSeconds: 10
    annotations: {}
    namespaceSelector: {}
    objectSelector: {}
    matchConditions: []
    mutatingWebhookConfiguration:
      annotations: {}
    validatingWebhookConfiguration:
      annotations: {}
    deployment:
      enabled: false
    patch:
      enabled: true
      image:
        registry: ghcr.io
        repository: jkroepke/kube-webhook-certgen
        tag: 1.8.8
        pullPolicy: IfNotPresent
      resources: {}
      priorityClassName: ""
      ttlSecondsAfterFinished: 60
      annotations: {}
      podAnnotations: {}
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      affinity: {}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount:
        create: true
        annotations: {}
        automountServiceAccountToken: true
    certManager:
      enabled: false
  namespaces: {}
  denyNamespaces: []
  networkPolicy:
    enabled: false
    flavor: kubernetes
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: true
    annotations: {}
  service:
    annotations: {}
    labels: {}
    clusterIP: ""
    ipDualStack:
      enabled: false
    type: ClusterIP
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  kubeletService:
    enabled: true
    namespace: kube-system
    selector: ""
    name: ""
  kubeletEndpointsEnabled: true
  kubeletEndpointSliceEnabled: false
  extraArgs: []
  serviceMonitor:
    selfMonitor: true
    additionalLabels: {}
    interval: ""
    scrapeTimeout: ""
    metricRelabelings: []
    relabelings: []
  resources: {}
  env:
    GOGC: "30"
  hostNetwork: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity: {}
  dnsConfig: {}
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: ""
    sha: ""
    pullPolicy: IfNotPresent
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: ""
      sha: ""
    resources: {}
  thanosImage:
    registry: quay.io
    repository: thanos/thanos
    tag: v0.42.4
    sha: ""
  prometheusInstanceSelector: ""
  alertmanagerInstanceSelector: ""
  thanosRulerInstanceSelector: ""
  secretFieldSelector: "type!=kubernetes.io/dockercfg,type!=helm.sh/release.v1"
  featureGates: {}
  automountServiceAccountToken: true
  extraVolumes: []
  extraVolumeMounts: []
