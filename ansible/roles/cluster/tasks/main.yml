- name: reset old cluster
  command:
    argv:
      - kubeadm 
      - reset
      - "-f"
  when: "inventory_hostname not in groups['haproxy']"
  tags: cluster_reset

- name: Validate the cluster inventory
  assert:
    that:
      - groups['control_plane'] | length > 0
      - kubeadm_token is match('^[a-z0-9]+\\.[a-z0-9]+$')
      - kube_pod_network_cidr is defined
    fail_msg: "The control plane, kubeadm token, and pod network CIDR are required."
  run_once: true

- name: Initialize the first control-plane node
  command:
    argv:
      - kubeadm
      - init
      - "--apiserver-advertise-address={{ hostvars[groups['control_plane'][0]].ip }}"
      - "--control-plane-endpoint={{ haproxy_public_ip }}:6443"
      - "--token={{ kubeadm_token }}"
      - "--pod-network-cidr={{ kube_pod_network_cidr }}"
    creates: /etc/kubernetes/admin.conf
  when: inventory_hostname == groups['control_plane'][0]
  register: kubeadm_init
  no_log: true

- name: Upload control-plane certificates
  command: kubeadm init phase upload-certs --upload-certs
  when: inventory_hostname == groups['control_plane'][0]
  register: kubeadm_certs
  changed_when: false
  no_log: true

- name: Calculate the cluster CA certificate hash
  shell: >-
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt
    | openssl rsa -pubin -outform der 2>/dev/null
    | sha256sum | awk '{print $1}'
  when: inventory_hostname == groups['control_plane'][0]
  register: kubeadm_ca_hash
  changed_when: false

- name: Extract the control-plane certificate key
  set_fact:
    kubeadm_certificate_key: "{{ kubeadm_certs.stdout_lines | select('match', '^[a-f0-9]{64}$') | list | last }}"
  when: inventory_hostname == groups['control_plane'][0]
  no_log: true

- name: Create the root kubeconfig directory
  file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: inventory_hostname == groups['control_plane'][0]

- name: Create the ubuntu kubeconfig directory
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'
  when: inventory_hostname == groups['control_plane'][0]

- name: Install kubeconfig for root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname == groups['control_plane'][0]

- name: Install kubeconfig for ubuntu
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  when: inventory_hostname == groups['control_plane'][0]

- name: Wait for the Kubernetes API to become available
  command: kubectl get nodes
  register: kubernetes_api
  retries: 12
  delay: 5
  until: kubernetes_api.rc == 0
  changed_when: false
  when: inventory_hostname == groups['control_plane'][0]

- name: Install the Calico CNI plugin
  command:
    argv:
      - kubectl
      - apply
      - -f
      - "{{ calico_manifest_url }}"
  when: inventory_hostname == groups['control_plane'][0]

- name: Install the kubelet serving CSR approver manifest
  copy:
    src: kubelet-csr-approver.yml
    dest: /root/kubelet-csr-approver.yml
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == groups['control_plane'][0]

- name: Apply the kubelet serving CSR approver
  command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - --filename=/root/kubelet-csr-approver.yml
  when: inventory_hostname == groups['control_plane'][0]

- name: Wait for the kubelet serving CSR approver rollout
  command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - rollout
      - status
      - deployment/kubelet-csr-approver
      - --namespace=kube-system
      - --timeout=180s
  register: kubelet_csr_approver_rollout
  retries: 3
  delay: 10
  until: kubelet_csr_approver_rollout.rc == 0
  changed_when: false
  when: inventory_hostname == groups['control_plane'][0]

- name: Join additional control-plane nodes
  command:
    argv:
      - kubeadm
      - join
      - "{{ haproxy_public_ip }}:6443"
      - "--apiserver-advertise-address={{ ip }}"
      - "--control-plane"
      - "--token={{ kubeadm_token }}"
      - "--certificate-key={{ hostvars[groups['control_plane'][0]].kubeadm_certificate_key }}"
      - "--discovery-token-ca-cert-hash=sha256:{{ hostvars[groups['control_plane'][0]].kubeadm_ca_hash.stdout }}"
    creates: /etc/kubernetes/kubelet.conf
  when:
    - inventory_hostname in groups['control_plane'][1:]
    - groups['control_plane'] | length > 1
  no_log: true

- name: Configure external cloud provider for worker and ingress kubelets
  lineinfile:
    path: /etc/default/kubelet
    regexp: '^KUBELET_EXTRA_ARGS='
    line: 'KUBELET_EXTRA_ARGS="--cloud-provider=external --provider-id=hcloud://{{ hcloud_server_id }} --node-ip={{ ip }}"'
    create: true
    owner: root
    group: root
    mode: '0644'
  when:
    - "'workers' in group_names or 'ingress' in group_names"
    - hcloud_server_id is defined
  notify: Restart kubelet after configuration change

- name: Join worker and ingress nodes
  command:
    argv:
      - kubeadm
      - join
      - "{{ haproxy_public_ip }}:6443"
      - "--token={{ kubeadm_token }}"
      - "--discovery-token-ca-cert-hash=sha256:{{ hostvars[groups['control_plane'][0]].kubeadm_ca_hash.stdout }}"
    creates: /etc/kubernetes/kubelet.conf
  when:
    - "'workers' in group_names or 'ingress' in group_names"
  no_log: true

- name: Wait for kubeadm to create kubelet.conf
  wait_for:
    path: /etc/kubernetes/kubelet.conf
    state: present
    timeout: 60
    msg: "kubeadm bootstrap did not create /etc/kubernetes/kubelet.conf"
  when: inventory_hostname not in groups['haproxy']

- name: Wait for kubeadm to create kubelet config.yaml
  wait_for:
    path: /var/lib/kubelet/config.yaml
    state: present
    timeout: 60
    msg: "kubeadm bootstrap did not create /var/lib/kubelet/config.yaml"
  when: inventory_hostname not in groups['haproxy']

- name: Wait for kubeadm to create kubeadm-flags.env
  wait_for:
    path: /var/lib/kubelet/kubeadm-flags.env
    state: present
    timeout: 60
    msg: "kubeadm bootstrap did not create /var/lib/kubelet/kubeadm-flags.env"
  when: inventory_hostname not in groups['haproxy']

- name: Enable kubelet serving certificate bootstrap after kubeadm
  lineinfile:
    path: /var/lib/kubelet/config.yaml
    regexp: '^serverTLSBootstrap:'
    line: 'serverTLSBootstrap: true'
    insertafter: EOF
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname not in groups['haproxy']
  notify: Restart kubelet after configuration change

- name: Restart joined kubelets after serving bootstrap configuration
  meta: flush_handlers

- name: Wait for the kubelet serving certificate
  block:
    - name: Wait for the kubelet serving certificate file
      wait_for:
        path: /var/lib/kubelet/pki/kubelet-server-current.pem
        timeout: 300
  rescue:
    - name: Collect kubelet-serving CSRs after certificate wait failure
      command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - csr
          - -o
          - wide
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kubelet_serving_csr_diagnostics
      changed_when: false
      failed_when: false

    - name: Collect kubelet CSR approver logs after certificate wait failure
      command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --namespace=kube-system
          - logs
          - deployment/kubelet-csr-approver
          - --all-containers
          - --tail=200
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: kubelet_csr_approver_diagnostics
      changed_when: false
      failed_when: false

    - name: Fail after collecting kubelet serving certificate diagnostics
      fail:
        msg: >-
          Timed out waiting for /var/lib/kubelet/pki/kubelet-server-current.pem on
          {{ inventory_hostname }}. Kubelet-serving CSR diagnostics:
          {{ kubelet_serving_csr_diagnostics.stdout | default('unavailable') }}
          Approver logs:
          {{ kubelet_csr_approver_diagnostics.stdout | default('unavailable') }}
  when: inventory_hostname not in groups['haproxy']

- name: Check for pending kubelet serving CSRs
  shell: >-
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get csr
    -o jsonpath='{range .items[?(@.spec.signerName=="kubernetes.io/kubelet-serving")]}{.metadata.name}{"\t"}{range .status.conditions[*]}{.type}{","}{end}{"\n"}{end}'
    | awk -F '\t' '$2 == "" { pending = 1; print } END { exit pending }'
  args:
    executable: /bin/bash
  register: pending_kubelet_serving_csrs
  changed_when: false
  retries: 12
  delay: 5
  until: pending_kubelet_serving_csrs.rc == 0
  when: inventory_hostname == groups['control_plane'][0]

- name: Fetch the cluster kubeconfig to the local machine
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "/home/raisa/.kube/kubeconfig.yml"
    flat: true
  when: inventory_hostname == groups['control_plane'][0]
  tags: [ kubeconfig ]
